name: Temporary PR254 current-main Swift baseline

on:
  push:
    branches:
      - tmp/pr254-current-main-swift-baseline

permissions:
  contents: read

jobs:
  swift-baseline:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Capture exact Swift baseline
        run: |
          set +e
          cd apps/MTPLXApp
          swift test > "$RUNNER_TEMP/swift-baseline.log" 2>&1
          status=$?
          echo "swift_test_status=$status" >> "$RUNNER_TEMP/swift-baseline.log"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: pr254-current-main-swift-baseline
          path: ${{ runner.temp }}/swift-baseline.log
