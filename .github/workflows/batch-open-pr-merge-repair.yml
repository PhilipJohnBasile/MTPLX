name: Repair PR 387 with Swift 6

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/batch-open-pr-merge-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Run PR 387 repair with Xcode 16.2
        shell: bash
        run: |
          set -euo pipefail
          git show b8a61e614ff718b689c18b199d875ff0e233e530:.github/workflows/batch-open-pr-merge-repair.yml > /tmp/repair387-source.yml
          python <<'PY'
          from pathlib import Path

          lines = Path('/tmp/repair387-source.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if line == '        run: |') + 1
          body = []
          for line in lines[start:]:
              if line.startswith('          '):
                  body.append(line[10:])
              elif not line.strip():
                  body.append('')
              else:
                  break
          script = '\n'.join(body) + '\n'
          old = 'raise ValueError(f"refusing to update through top-level symlink: {raw_destination}")'
          new = 'raise ValueError(f"refusing to update through top-level symlink; path does not remain directly inside cache: {raw_destination}")'
          if old not in script:
              raise SystemExit('symlink error contract anchor changed')
          script = script.replace(old, new, 1)
          build = 'swift build --package-path apps/MTPLXApp --product MTPLXApp'
          replacement = 'sudo xcode-select -s /Applications/Xcode_16.2.app\nswift --version\n' + build
          if build not in script:
              raise SystemExit('Swift build anchor changed')
          script = script.replace(build, replacement, 1)
          Path('/tmp/repair387.sh').write_text(script)
          PY
          bash /tmp/repair387.sh
