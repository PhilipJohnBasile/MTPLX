name: Inspect remaining PR conflicts

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/batch-open-pr-merge-repair.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Show conflict hunks
        shell: bash
        run: |
          set -u
          git config user.name "Philip John Basile"
          git config user.email "PBasile@Basilecom.com"
          git remote add upstream https://github.com/youssofal/MTPLX.git || true
          git fetch upstream main
          branches=(
            codex/multiple-model-directories
            codex/open-in-omp
            codex/issue-374-remove-model
            codex/repair-pr220-hermes-app-only
            feat/runtime-systems-dashboard
            feat/native-operations-dashboard
            feat/expert-locality-telemetry
            feat/semantic-session-anchors
            codex/deepseek-v4-mlxserve-v26
          )
          for branch in "${branches[@]}"; do
            echo "===== BRANCH $branch ====="
            git reset --hard
            git clean -fd
            git fetch origin "$branch"
            git checkout -B "$branch" "origin/$branch"
            set +e
            git merge --no-commit --no-ff upstream/main >/tmp/merge.out 2>&1
            rc=$?
            set -e
            cat /tmp/merge.out
            if [ "$rc" -ne 0 ]; then
              for f in $(git diff --name-only --diff-filter=U); do
                echo "===== FILE $f ====="
                git diff --cc --unified=3 -- "$f"
              done
              git merge --abort || true
            fi
          done
