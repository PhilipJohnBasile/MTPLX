name: Repair PR 387 final validation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/batch-open-pr-merge-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Run corrected PR 387 repair
        shell: bash
        run: |
          set -euo pipefail
          git show HEAD^:.github/workflows/batch-open-pr-merge-repair.yml > /tmp/previous.yml
          python <<'PY'
          from pathlib import Path

          lines = Path('/tmp/previous.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if line == '        run: |') + 1
          body = []
          for line in lines[start:]:
              if line.startswith('          '):
                  body.append(line[10:])
              elif not line.strip():
                  body.append('')
              else:
                  break
          script = '\n'.join(body) + '\n'
          old = 'raise ValueError(f"refusing to update through top-level symlink: {raw_destination}")'
          new = 'raise ValueError(f"refusing to update through top-level symlink; path does not remain directly inside cache: {raw_destination}")'
          if old not in script:
              raise SystemExit('symlink error contract anchor changed')
          Path('/tmp/repair387.sh').write_text(script.replace(old, new, 1))
          PY
          bash /tmp/repair387.sh
