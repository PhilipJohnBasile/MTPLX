name: Repair PR 254 against current main

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/batch-open-pr-merge-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Run semantic PR 254 repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Philip John Basile"
          git config user.email "PBasile@Basilecom.com"
          git remote add upstream https://github.com/youssofal/MTPLX.git || true
          git fetch upstream main
          python -m pip install -U pip >/dev/null
          python -m pip install -e '.[dev,server]' >/dev/null

          prepare() {
            local b="$1"
            git reset --hard
            git clean -fd
            git fetch origin "$b"
            git checkout -B "$b" "origin/$b"
            set +e
            git merge --no-commit --no-ff -X ours upstream/main
            local rc=$?
            set -e
            echo "merge rc=$rc for $b"
          }

          finish() {
            local b="$1"
            git add -A
            local unresolved
            unresolved="$(git diff --name-only --diff-filter=U)"
            if [ -n "$unresolved" ]; then
              echo "unresolved paths in $b:" >&2
              echo "$unresolved" >&2
              exit 1
            fi
            if git grep -n -E '^(<<<<<<<|>>>>>>>)' -- '*.swift' '*.py' '*.ts' '*.tsx'; then
              echo "conflict markers remain in $b" >&2
              exit 1
            fi
            git commit -m "Merge upstream main into $b"
            git diff upstream/main...HEAD --check
            git push origin "HEAD:$b"
            echo "FIXED $b $(git rev-parse HEAD)"
          }

          git show f43cc97255b515cdfbd4b3408d00063a5edbd757:.github/workflows/batch-open-pr-merge-repair.yml > /tmp/final-two.yml
          python <<'PY'
          from pathlib import Path

          lines = Path('/tmp/final-two.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if line == '        run: |') + 1
          body = []
          for line in lines[start:]:
              if line.startswith('          '):
                  body.append(line[10:])
              elif not line.strip():
                  body.append('')
              else:
                  break
          script = '\n'.join(body) + '\n'
          marker = '# PR #254 — DeepSeek V4 target-only external mlx-serve backend.'
          if marker not in script:
              raise SystemExit('PR 254 repair marker not found')
          tail = script[script.index(marker):]
          Path('/tmp/repair254-tail.sh').write_text(tail)
          PY
          source /tmp/repair254-tail.sh
