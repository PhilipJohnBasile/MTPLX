name: PR 399 merge diagnose

on:
  push:
    branches:
      - codex/mtplx-local-agent-system
    paths:
      - .github/workflows/pr399-merge-diagnose.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch upstream main
        run: |
          git remote add upstream https://github.com/youssofal/MTPLX.git || true
          git fetch upstream main
      - name: Attempt merge and show conflicts
        shell: bash
        run: |
          set +e
          git merge --no-commit --no-ff upstream/main
          rc=$?
          echo "merge_exit=$rc"
          echo "=== unmerged files ==="
          git diff --name-only --diff-filter=U
          echo "=== conflict hunks ==="
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            echo "===== $f ====="
            git diff --cc -- "$f"
          done < <(git diff --name-only --diff-filter=U)
          git merge --abort >/dev/null 2>&1 || true
          exit 0
