name: Temporary semantic runtime module export

on:
  push:
    branches:
      - feat/semantic-memory-expert-matrix
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/semantic-memory-expert-matrix
          fetch-depth: 0
      - name: Export native modules and tests
        shell: bash
        run: |
          set -euo pipefail
          tar -czf /tmp/semantic-runtime-modules.tar.gz \
            mtplx/semantic_anchors.py \
            mtplx/memory_governor.py \
            mtplx/expert_locality.py \
            tests/test_semantic_anchors.py \
            tests/test_memory_governor.py \
            tests/test_expert_locality.py
      - uses: actions/upload-artifact@v4
        with:
          name: semantic-runtime-modules
          path: /tmp/semantic-runtime-modules.tar.gz
