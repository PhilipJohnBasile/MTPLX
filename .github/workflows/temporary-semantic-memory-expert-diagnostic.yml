name: Temporary semantic-memory-expert integration map

on:
  push:
    branches:
      - feat/semantic-memory-expert-matrix

permissions:
  contents: write

jobs:
  map:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Map current integration points
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/integration-map.txt
          from __future__ import annotations

          import re
          from pathlib import Path

          SECTIONS = [
              (
                  "SessionBank boundary producers/consumers",
                  [Path("mtplx"), Path("tests")],
                  r"boundary_cache_snapshots|gdn_boundaries|recurrent_boundary_at_or_below|SessionBank\.put\(",
                  5,
                  700,
              ),
              (
                  "EngineSession boundaries and manager",
                  [Path("mtplx/engine_session.py")],
                  r"class EngineSessionManager|def add_boundary|def _record_interval_boundaries|def commit_prompt_prefix|def commit_retokenized_prefix|def in_flight_generation",
                  8,
                  500,
              ),
              (
                  "Server call sites",
                  [Path("mtplx/server"), Path("mtplx")],
                  r"commit_prompt_prefix|commit_retokenized_prefix|session_commit|session_restore|EngineSessionManager",
                  6,
                  900,
              ),
              (
                  "Scheduler safe points / inflight",
                  [Path("mtplx/model_scheduler.py"), Path("mtplx/server"), Path("mtplx/engine_session.py")],
                  r"safe.?point|in_flight|idle_lane|foreground|submit_idle|scheduler",
                  5,
                  900,
              ),
              (
                  "Expert router hooks",
                  [Path("mtplx/models"), Path("mtplx/kernels"), Path("mtplx/a3b_mtp_batch.py")],
                  r"topk|top_k|expert_indices|router_logits|selected_experts|indices\s*=",
                  5,
                  1200,
              ),
              (
                  "Existing metrics/admin surfaces",
                  [Path("mtplx/server"), Path("mtplx/metrics.py"), Path("mtplx/engine_session.py")],
                  r"session_bank|cache_bank|roofline|metrics|health",
                  5,
                  900,
              ),
          ]

          def files(roots: list[Path]):
              seen: set[Path] = set()
              for root in roots:
                  if root.is_file():
                      candidates = [root]
                  elif root.is_dir():
                      candidates = root.rglob("*.py")
                  else:
                      continue
                  for path in candidates:
                      if path not in seen:
                          seen.add(path)
                          yield path

          for title, roots, pattern, context, limit in SECTIONS:
              print(f"=== {title} ===")
              regex = re.compile(pattern, re.IGNORECASE)
              emitted = 0
              for path in files(roots):
                  try:
                      lines = path.read_text(encoding="utf-8").splitlines()
                  except (UnicodeDecodeError, OSError):
                      continue
                  matches = [index for index, line in enumerate(lines) if regex.search(line)]
                  if not matches:
                      continue
                  covered: set[int] = set()
                  for index in matches:
                      if emitted >= limit:
                          break
                      start = max(0, index - context)
                      end = min(len(lines), index + context + 1)
                      selected = [i for i in range(start, end) if i not in covered]
                      if not selected:
                          continue
                      print(f"--- {path}:{index + 1} ---")
                      for i in selected:
                          marker = ">" if i == index else " "
                          print(f"{marker}{i + 1:6d}: {lines[i]}")
                          covered.add(i)
                          emitted += 1
                          if emitted >= limit:
                              break
                  if emitted >= limit:
                      print(f"... section truncated at {limit} lines ...")
                      break
              print()
          PY
          cat /tmp/integration-map.txt
          git config user.name 'Philip John Basile'
          git config user.email 'PBasile@Basilecom.com'
          git checkout -B agent/semantic-memory-expert-map
          mkdir -p diagnostics
          cp /tmp/integration-map.txt diagnostics/semantic-memory-expert-integration-map.txt
          git add diagnostics/semantic-memory-expert-integration-map.txt
          git commit -m 'diagnostics: map semantic memory expert integration points'
          git push "https://x-access-token:${GH_TOKEN}@github.com/PhilipJohnBasile/MTPLX.git" HEAD:agent/semantic-memory-expert-map --force
