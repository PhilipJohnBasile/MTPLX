name: Temporary semantic runtime source export

on:
  push:
    branches:
      - feat/semantic-memory-expert-matrix

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/semantic-memory-expert-matrix
          fetch-depth: 0

      - name: Export exact source
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz --output=/tmp/mtplx-semantic-source.tar.gz HEAD
          git rev-parse HEAD > /tmp/head.txt

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: mtplx-semantic-source
          path: |
            /tmp/mtplx-semantic-source.tar.gz
            /tmp/head.txt
