name: materialize-native-adaptive-phase2

on:
  push:
    branches: [agent/native-systems-phase2-final-20260824]

concurrency:
  group: materialize-native-adaptive-phase2
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-14
    timeout-minutes: 60
    env:
      BASE_SHA: 88954d81dad0c40e02df4b865b838faf1b14f750
      PR_HEAD: upstream/native-systems-integration
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: agent/native-systems-phase2-final-20260824
          fetch-depth: 0

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"

      - uses: oven-sh/setup-bun@v2

      - name: Verify publication base and upstream lease
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$BASE_SHA^{commit}"
          remote_head="$(git ls-remote origin "refs/heads/$PR_HEAD" | awk '{print $1}')"
          test "$remote_head" = "$BASE_SHA"

      - name: Apply marker-guarded runtime and dashboard integration
        shell: bash
        run: |
          set -euo pipefail
          python scripts/materialize_native_adaptive_phase2.py

      - name: Normalize and lint phase-two files
        shell: bash
        run: |
          set -euo pipefail
          files=(
            mtplx/expert_residency.py
            mtplx/unified_memory.py
            mtplx/otlp_export.py
            mtplx/policy_hooks.py
            mtplx/replay_orchestrator.py
            mtplx/native_adaptive.py
            tests/test_expert_residency.py
            tests/test_unified_memory.py
            tests/test_otlp_export.py
            tests/test_policy_hooks.py
            tests/test_replay_orchestrator.py
            tests/test_native_adaptive.py
          )
          python -m pip install -U pip
          python -m pip install -e ".[dev,server]"
          python -m ruff check --fix --select I,UP035,UP037,RUF100 "${files[@]}"
          python -m ruff format "${files[@]}"
          python -m ruff check --ignore BLE001,S310 "${files[@]}"

      - name: Test native systems and compatibility contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_semantic_anchors.py \
            tests/test_memory_governor.py \
            tests/test_expert_locality.py \
            tests/test_deterministic_replay.py \
            tests/test_trace_parity.py \
            tests/test_request_capture.py \
            tests/test_runtime_systems.py \
            tests/test_dashboard_endpoints.py \
            tests/test_expert_residency.py \
            tests/test_unified_memory.py \
            tests/test_otlp_export.py \
            tests/test_policy_hooks.py \
            tests/test_replay_orchestrator.py \
            tests/test_native_adaptive.py
          python -m pytest -q \
            tests/test_no_mlx_imports.py \
            tests/test_public_cli.py \
            tests/test_runtime_kpis.py \
            tests/test_server_openai.py \
            tests/test_openai_bridge.py \
            tests/test_thermal.py \
            tests/test_cache_state.py
          python -m compileall -q mtplx tests
          git diff --check "$BASE_SHA"

      - name: Build production dashboard
        shell: bash
        run: |
          set -euo pipefail
          cd dashboard
          bun install --frozen-lockfile
          bun run build

      - name: Build and smoke-test distribution
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -U build twine
          rm -rf dist build
          python -m build
          python -m twine check dist/*
          scripts/fresh_venv_smoke.sh

      - name: Create one clean phase-two commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            scripts/materialize_native_adaptive_phase2.py \
            .github/workflows/materialize-native-adaptive-phase2.yml
          git config user.name "OpenAI Integration Worker"
          git config user.email "noreply@openai.com"
          git reset --soft "$BASE_SHA"
          git add -A
          test ! -e scripts/materialize_native_adaptive_phase2.py
          test ! -e .github/workflows/materialize-native-adaptive-phase2.yml
          git diff --cached --check
          git commit -m "feat(runtime): complete native adaptive systems"
          test "$(git rev-list --count "$BASE_SHA"..HEAD)" = "1"
          test -z "$(git status --porcelain)"

      - name: Publish staging branch and update upstream PR head
        shell: bash
        run: |
          set -euo pipefail
          final_sha="$(git rev-parse HEAD)"
          git push --force origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
          git push \
            --force-with-lease="refs/heads/$PR_HEAD:$BASE_SHA" \
            origin "HEAD:refs/heads/$PR_HEAD"
          echo "Published $final_sha to $PR_HEAD"
