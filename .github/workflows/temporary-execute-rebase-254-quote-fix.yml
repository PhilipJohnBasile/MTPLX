name: Temporary finalize PR 254

on:
  push:
    branches:
      - codex/deepseek-v4-mlxserve-v26

permissions:
  contents: write

concurrency:
  group: temporary-finalize-pr-254
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/deepseek-v4-mlxserve-v26
          fetch-depth: 0

      - name: Execute corrected semantic rebase and validation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          wrapper = Path(".github/workflows/temporary-execute-rebase-254-macos14.yml")
          lines = wrapper.read_text(encoding="utf-8").splitlines()
          blocks: list[str] = []
          index = 0
          while index < len(lines):
              if lines[index] == "        run: |":
                  index += 1
                  block: list[str] = []
                  while index < len(lines):
                      current = lines[index]
                      if current and len(current) - len(current.lstrip()) <= 8:
                          break
                      if current.startswith("          "):
                          block.append(current[10:])
                      elif not current:
                          block.append("")
                      else:
                          raise SystemExit(f"unexpected wrapper indentation: {current!r}")
                      index += 1
                  blocks.append("\n".join(block))
                  continue
              index += 1

          if len(blocks) != 1:
              raise SystemExit(f"expected one wrapper run block, found {len(blocks)}")
          script = blocks[0]

          start = "candidate_patch = r'''python - <<'PY_PATCH_254'"
          end = "\n'''\nblocks[2] = candidate_patch"
          if script.count(start) != 1 or script.count(end) != 1:
              raise SystemExit("candidate patch delimiter shape changed")
          script = script.replace(
              start,
              'candidate_patch = r"""python - <<\'PY_PATCH_254\'',
              1,
          )
          script = script.replace(
              end,
              '\n"""\nblocks[2] = candidate_patch',
              1,
          )

          restart_old = (
              "'''        return try await start(\n"
              "        command: command,\n"
              "        healthBaseURL: healthBaseURL,\n"
              "        apiKey: apiKey,\n"
              "        probeHealth: probeHealth,\n"
          )
          restart_old_fixed = (
              "'''        return try await start(\n"
              "            command: command,\n"
              "            healthBaseURL: healthBaseURL,\n"
              "            apiKey: apiKey,\n"
              "            probeHealth: probeHealth,\n"
          )
          restart_new = (
              "'''        return try await start(\n"
              "        command: command,\n"
              "        healthBaseURL: healthBaseURL,\n"
              "        apiKey: apiKey,\n"
              "        backendKind: backendKind,\n"
              "        probeHealth: probeHealth,\n"
          )
          restart_new_fixed = (
              "'''        return try await start(\n"
              "            command: command,\n"
              "            healthBaseURL: healthBaseURL,\n"
              "            apiKey: apiKey,\n"
              "            backendKind: backendKind,\n"
              "            probeHealth: probeHealth,\n"
          )
          if script.count(restart_old) != 1 or script.count(restart_new) != 1:
              raise SystemExit(
                  "unexpected restart forwarding counts: "
                  f"old={script.count(restart_old)} new={script.count(restart_new)}"
              )
          script = script.replace(restart_old, restart_old_fixed, 1)
          script = script.replace(restart_new, restart_new_fixed, 1)

          candidate_lines = script.splitlines()
          dashboard_matches = [
              index
              for index, line in enumerate(candidate_lines)
              if line.strip() == 'dashboard.write_text(text, encoding="utf-8")'
              and index + 1 < len(candidate_lines)
              and candidate_lines[index + 1].strip() == "PY_PATCH_254"
          ]
          if len(dashboard_matches) != 1:
              raise SystemExit(
                  "unexpected candidate test-patch anchor count: "
                  f"{len(dashboard_matches)}"
              )
          test_patch_lines = [
              "",
              "tests_path = Path(",
              '    "apps/MTPLXApp/Tests/MTPLXAppCoreTests/MTPLXAppCoreTests.swift"',
              ")",
              'tests_text = tests_path.read_text(encoding="utf-8")',
              'needle = "        let readyTarget = LaunchTargetRecorder()" + chr(10)',
              'replacement = "        let readyTarget = await LaunchTargetRecorder()" + chr(10)',
              "if tests_text.count(needle) != 2:",
              "    raise SystemExit(",
              '        "expected two actor-isolated LaunchTargetRecorder initializations; "',
              '        f"found {tests_text.count(needle)}"',
              "    )",
              "tests_path.write_text(",
              '    tests_text.replace(needle, replacement), encoding="utf-8"',
              ")",
          ]
          insert_at = dashboard_matches[0] + 1
          candidate_lines[insert_at:insert_at] = test_patch_lines

          dashboard_path = (
              "apps/MTPLXApp/Sources/MTPLXAppCore/Models/DashboardModels.swift"
          )
          dashboard_add_matches = [
              index
              for index, line in enumerate(candidate_lines)
              if line.strip() == dashboard_path
          ]
          if len(dashboard_add_matches) != 1:
              raise SystemExit(
                  "unexpected candidate git-add dashboard count: "
                  f"{len(dashboard_add_matches)}"
              )
          dashboard_add_index = dashboard_add_matches[0]
          dashboard_add_line = candidate_lines[dashboard_add_index]
          dashboard_indent = dashboard_add_line[
              : len(dashboard_add_line) - len(dashboard_add_line.lstrip())
          ]
          candidate_lines[dashboard_add_index] = (
              dashboard_indent + dashboard_path + " " + chr(92)
          )
          candidate_lines.insert(
              dashboard_add_index + 1,
              dashboard_indent
              + "apps/MTPLXApp/Tests/MTPLXAppCoreTests/MTPLXAppCoreTests.swift",
          )
          script = "\n".join(candidate_lines) + "\n"

          validation_anchor = 'blocks[2] = candidate_patch + "\\n" + blocks[2]'
          if script.count(validation_anchor) != 1:
              raise SystemExit(
                  "unexpected validation composition count: "
                  f"{script.count(validation_anchor)}"
              )
          validation_patch = validation_anchor + '''
          validation_lines = blocks[2].splitlines()
          swift_test_matches = [
              index
              for index, line in enumerate(validation_lines)
              if line.strip() == "swift test"
          ]
          swift_build_matches = [
              index
              for index, line in enumerate(validation_lines)
              if line.strip() == "swift build -c release"
          ]
          if len(swift_test_matches) != 1 or len(swift_build_matches) != 1:
              raise SystemExit(
                  "unexpected embedded Swift validation counts: "
                  f"test={len(swift_test_matches)} "
                  f"build={len(swift_build_matches)}"
              )
          test_index = swift_test_matches[0]
          build_index = swift_build_matches[0]
          test_indent = validation_lines[test_index][
              : len(validation_lines[test_index])
              - len(validation_lines[test_index].lstrip())
          ]
          build_indent = validation_lines[build_index][
              : len(validation_lines[build_index])
              - len(validation_lines[build_index].lstrip())
          ]
          validation_lines[test_index] = (
              test_indent
              + "swift test -Xswiftc -swift-version -Xswiftc 5 "
              + "-Xswiftc -strict-concurrency=minimal"
          )
          validation_lines[build_index] = (
              build_indent
              + "swift build -c release -Xswiftc -swift-version -Xswiftc 5 "
              + "-Xswiftc -strict-concurrency=minimal"
          )
          blocks[2] = "\\n".join(validation_lines) + "\\n"
          '''
          script = script.replace(validation_anchor, validation_patch, 1)

          script_lines = script.splitlines()
          cleanup_matches = [
              index
              for index, line in enumerate(script_lines)
              if line.strip().startswith(
                  ".github/workflows/temporary-execute-rebase-254-macos14.yml"
              )
          ]
          if len(cleanup_matches) != 1:
              raise SystemExit(
                  f"expected one cleanup anchor, found {len(cleanup_matches)}"
              )
          anchor_line = script_lines[cleanup_matches[0]]
          indent = anchor_line[: len(anchor_line) - len(anchor_line.lstrip())]
          script_lines.insert(
              cleanup_matches[0] + 1,
              indent
              + ".github/workflows/temporary-execute-rebase-254-quote-fix.yml "
              + chr(92),
          )
          script_lines.insert(
              cleanup_matches[0] + 2,
              indent + ".github/pr254-wrapper-template.yml " + chr(92),
          )
          script = "\n".join(script_lines) + "\n"

          Path("/tmp/pr254-finalize.sh").write_text(script, encoding="utf-8")
          PY
          bash -n /tmp/pr254-finalize.sh
          bash /tmp/pr254-finalize.sh
