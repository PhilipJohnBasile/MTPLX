name: Temporary execute PR 254 rebase on macOS 14

on:
  push:
    branches:
      - codex/deepseek-v4-mlxserve-v26

permissions:
  contents: write

jobs:
  execute-guarded-workflow:
    runs-on: macos-14
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/deepseek-v4-mlxserve-v26
          fetch-depth: 0

      - name: Execute the existing guarded semantic-rebase scripts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/temporary-rebase-254.yml")
          lines = workflow.read_text(encoding="utf-8").splitlines()
          blocks: list[str] = []
          index = 0
          while index < len(lines):
              line = lines[index]
              if line == "        run: |":
                  index += 1
                  block: list[str] = []
                  while index < len(lines):
                      current = lines[index]
                      if current and len(current) - len(current.lstrip()) <= 8:
                          break
                      if current.startswith("          "):
                          block.append(current[10:])
                      elif not current:
                          block.append("")
                      else:
                          raise SystemExit(f"unexpected workflow indentation: {current!r}")
                      index += 1
                  blocks.append("\n".join(block))
                  continue
              index += 1

          if len(blocks) != 4:
              raise SystemExit(f"expected four guarded run blocks, found {len(blocks)}")

          # Preserve current main's non-optional native health contract while
          # keeping the external backend's intentionally absent MTPLX payload.
          supervisor_anchor = '''def merge_supervisor(ours: str, theirs: str) -> tuple[str, set[str]]:
              kinds: set[str] = set()
              text = ours
          '''
          supervisor_replacement = supervisor_anchor + '''    if (
                  ours.strip() == ") async throws -> HealthPayload {"
                  and "waitForExternalMlxServeHealth" in theirs
                  and "return nil" in theirs
              ):
                  return (
                      "    ) async throws -> HealthPayload? {\\n"
                      "        if backendKind == .externalMlxServe {\\n"
                      "            try await waitForExternalMlxServeHealth(\\n"
                      "                baseURL: baseURL,\\n"
                      "                apiKey: apiKey,\\n"
                      "                timeoutSeconds: timeoutSeconds,\\n"
                      "                onPhase: onPhase\\n"
                      "            )\\n"
                      "            // External mlx-serve exposes only its raw\\n"
                      "            // liveness contract; do not fabricate MTPLX\\n"
                      "            // sessions, metrics, or launch metadata.\\n"
                      "            return nil\\n"
                      "        }\\n",
                      {"wait_for_health"},
                  )
          '''
          if blocks[0].count(supervisor_anchor) != 1:
              raise SystemExit("could not locate PR 254 supervisor resolver")
          blocks[0] = blocks[0].replace(supervisor_anchor, supervisor_replacement, 1)

          # refreshStaticState gained parameters on current main. Insert the
          # external-backend guard at the stable client declaration rather than
          # replacing the old zero-argument function boundary.
          refresh_old = r'''                      "    ) async throws {\n        let client = apiClient\n",
                      "    ) async throws {\n"
                      "        guard supportsMTPLXLiveControls else {\n"
          '''
          refresh_new = r'''                      "        let client = apiClient\n",
                      "        guard supportsMTPLXLiveControls else {\n"
          '''
          if blocks[0].count(refresh_old) != 1:
              raise SystemExit("could not locate PR 254 refreshStaticState resolver")
          blocks[0] = blocks[0].replace(refresh_old, refresh_new, 1)

          cleanup = """rm -f \\
            .github/workflows/temporary-rebase-254.yml \\
            .github/workflows/temporary-execute-rebase-254-macos14.yml \\
            .github/temporary-rebase-254-trigger.txt
          """
          marker = "git reset --soft upstream/main"
          if blocks[1].count(marker) != 1:
              raise SystemExit("could not locate the PR 254 squash boundary")
          blocks[1] = blocks[1].replace(marker, cleanup + marker, 1)

          if "HEAD:sync/rebased-254-ready" not in blocks[3] or "--force" not in blocks[3]:
              raise SystemExit("unexpected PR 254 helper publish block")
          blocks[3] += (
              "\n"
              "git push "
              "\"https://x-access-token:${GH_TOKEN}@github.com/PhilipJohnBasile/MTPLX.git\" "
              "HEAD:codex/deepseek-v4-mlxserve-v26 "
              "--force-with-lease=refs/heads/codex/deepseek-v4-mlxserve-v26:${GITHUB_SHA}\n"
          )

          script: list[str] = ["set -euo pipefail"]
          for number, block in enumerate(blocks, start=1):
              script.extend(
                  [
                      f'echo "::group::guarded PR 254 block {number}"',
                      block,
                      'echo "::endgroup::"',
                  ]
              )
          Path("/tmp/pr254-guarded-workflow.sh").write_text(
              "\n\n".join(script) + "\n", encoding="utf-8"
          )
          PY
          bash /tmp/pr254-guarded-workflow.sh
