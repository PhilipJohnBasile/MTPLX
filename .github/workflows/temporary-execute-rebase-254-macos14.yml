name: Temporary execute corrected PR 254 finalizer v2

on:
  push:
    branches:
      - codex/deepseek-v4-mlxserve-v26

permissions:
  contents: write

concurrency:
  group: temporary-execute-pr-254-finalizer-v2
  cancel-in-progress: true

jobs:
  execute:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/deepseek-v4-mlxserve-v26
          fetch-depth: 0

      - name: Execute corrected finalizer directly
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow = Path(
              ".github/workflows/temporary-execute-rebase-254-quote-fix.yml"
          )
          lines = workflow.read_text(encoding="utf-8").splitlines()
          blocks: list[str] = []
          index = 0
          while index < len(lines):
              if lines[index] == "        run: |":
                  index += 1
                  block: list[str] = []
                  while index < len(lines):
                      current = lines[index]
                      if current and len(current) - len(current.lstrip()) <= 8:
                          break
                      if current.startswith("          "):
                          block.append(current[10:])
                      elif not current:
                          block.append("")
                      else:
                          raise SystemExit(
                              f"unexpected finalizer indentation: {current!r}"
                          )
                      index += 1
                  blocks.append("\n".join(block))
                  continue
              index += 1

          if len(blocks) != 1:
              raise SystemExit(
                  f"expected one finalizer run block, found {len(blocks)}"
              )
          script = blocks[0]
          old = (
              'wrapper = Path('
              '".github/workflows/temporary-execute-rebase-254-macos14.yml"'
              ')'
          )
          new = 'wrapper = Path(".github/pr254-wrapper-template.yml")'
          if old in script:
              script = script.replace(old, new, 1)
          elif new not in script:
              raise SystemExit("finalizer wrapper path is neither supported shape")
          Path("/tmp/pr254-current-finalizer.sh").write_text(
              script + "\n", encoding="utf-8"
          )
          PY
          bash -n /tmp/pr254-current-finalizer.sh
          bash /tmp/pr254-current-finalizer.sh
