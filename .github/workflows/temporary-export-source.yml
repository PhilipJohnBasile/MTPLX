name: Temporary export MTPLX source

on:
  push:
    branches:
      - feat/semantic-replay-observability

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Archive source tree
        shell: bash
        run: |
          set -euo pipefail
          tar \
            --exclude=.git \
            --exclude=.github/workflows/temporary-export-source.yml \
            -czf /tmp/mtplx-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: mtplx-source
          path: /tmp/mtplx-source.tar.gz
          if-no-files-found: error
          retention-days: 1
