name: Temporary Swift 6 baseline fixes
on:
  push:
    branches: [tmp/pr254-current-main-swift-baseline]
permissions:
  contents: read
jobs:
  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Apply isolated baseline fixes and validate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          onboarding = Path('apps/MTPLXApp/Sources/MTPLXAppCore/Onboarding/OnboardingOrchestrator.swift')
          text = onboarding.read_text()
          old = 'downloadTask = Task.detached(priority: .userInitiated) { [weak self, downloader, repo, totalBytes, extraEnvironment] in'
          new = 'downloadTask = Task(priority: .userInitiated) { [weak self, downloader, repo, totalBytes, extraEnvironment] in'
          assert text.count(old) == 1
          onboarding.write_text(text.replace(old, new, 1))

          dashboard = Path('apps/MTPLXApp/Sources/MTPLXAppCore/Models/DashboardModels.swift')
          text = dashboard.read_text()
          old = '        switch values["session_cache_hit"]?.boolValue {\n        case true: return .hit\n        case false: return .miss\n        case nil: return .unknown\n        }\n'
          new = '        switch values["session_cache_hit"]?.boolValue {\n        case .some(true): return .hit\n        case .some(false): return .miss\n        case .none: return .unknown\n        }\n'
          assert text.count(old) == 1
          dashboard.write_text(text.replace(old, new, 1))

          wordmark = Path('apps/MTPLXApp/Sources/MTPLXAppHost/Views/WordmarkView.swift')
          text = wordmark.read_text()
          old = 'private let cachedWordmarkImage: NSImage? = {'
          new = '@MainActor private let cachedWordmarkImage: NSImage? = {'
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          old = 'func wordmarkNSImage() -> NSImage? { cachedWordmarkImage }'
          new = '@MainActor func wordmarkNSImage() -> NSImage? { cachedWordmarkImage }'
          assert text.count(old) == 1
          wordmark.write_text(text.replace(old, new, 1))
          PY
          cd apps/MTPLXApp
          swift test
          swift build -c release
