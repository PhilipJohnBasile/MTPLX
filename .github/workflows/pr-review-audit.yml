name: Published PR review validation
on:
  push:
    branches: [codex/pr-review-audit-20260906]
    paths: [.github/workflows/pr-review-audit.yml]
permissions:
  contents: read
jobs:
  validate:
    if: github.repository == 'PhilipJohnBasile/MTPLX'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 892a0d346f542ed3b71c9e378ac1158bdcfc610b
          path: anchors
          fetch-depth: 4
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: a47ea5eaf08f600b657ade1dfbe1baf51fce90aa
          path: responses
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ruff
      - name: Published source tests and checks
        working-directory: anchors
        run: |
          set -o pipefail
          mkdir -p ../receipts
          python -m unittest discover -s tests -p test_semantic_anchor_replay.py -v 2>&1 | tee ../receipts/anchor-tests.log
          python -m ruff check scripts/bench_semantic_anchor_replay.py tests/test_semantic_anchor_replay.py 2>&1 | tee ../receipts/ruff.log
          python -m compileall -q scripts/bench_semantic_anchor_replay.py tests/test_semantic_anchor_replay.py
          git diff c73af258def9abdef32765a89b502d9f41b662b6...HEAD --check
          sha256sum scripts/bench_semantic_anchor_replay.py tests/test_semantic_anchor_replay.py > ../receipts/source-sha256.txt
      - name: Validate committed Codex capture receipt
        run: |
          python - <<'PY'
          import json, pathlib
          receipt = json.loads(pathlib.Path('responses/docs/validation/codex-0.144.1-local-tool-profile.json').read_text())
          assert receipt['client'] == 'codex-cli 0.144.1'
          assert len(receipt['cases']) == 4
          assert 'web_search' in receipt['cases'][0]['tool_types']
          for case in receipt['cases'][2:]:
              assert case['feature_list_exit'] == 0
              assert case['image_generation_enabled'] is False
              assert set(case['tool_types']) == {'function', 'namespace'}
          assert receipt['cases'][3]['apps_enabled'] is False
          pathlib.Path('receipts/codex-receipt-check.txt').write_text('Committed receipt schema/content assertions passed; live capture evidence remains run 34064490796. No model was run.\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-pr-review-validation
          path: receipts/
          retention-days: 7
          if-no-files-found: error
