name: PR review client contract audit
on:
  push:
    branches: [codex/pr-review-audit-20260906]
    paths: [.github/workflows/pr-review-audit.yml]
permissions:
  contents: read
jobs:
  audit:
    if: github.repository == 'PhilipJohnBasile/MTPLX'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c73af258def9abdef32765a89b502d9f41b662b6
          path: anchors
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact maintainer-tested client
        run: |
          npm install --global @openai/codex@0.144.1
          python -m pip install zstandard
      - name: Capture first-request tool types without a model or account
        shell: bash
        run: |
          mkdir -p receipts
          python - <<'PY'
          import gzip, json, os, pathlib, subprocess, tempfile, threading, zlib
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          import zstandard
          received = []
          class Handler(BaseHTTPRequestHandler):
              def log_message(self, *args):
                  pass
              def do_POST(self):
                  data = self.rfile.read(int(self.headers.get('Content-Length', '0')))
                  encoding = self.headers.get('Content-Encoding', '')
                  if encoding == 'zstd':
                      with zstandard.ZstdDecompressor().stream_reader(data) as reader:
                          data = reader.read(4 * 1024 * 1024)
                  elif encoding == 'gzip': data = gzip.decompress(data)
                  elif encoding == 'deflate': data = zlib.decompress(data)
                  body = json.loads(data)
                  tools = body.get('tools', [])
                  received.append({'path': self.path, 'tool_types': sorted(set(t.get('type', '') for t in tools)), 'tool_count': len(tools), 'request_bytes': len(data)})
                  response = json.dumps({'error': {'message': 'Intentional capture-only rejection; no inference performed', 'type': 'invalid_request_error'}}).encode()
                  self.send_response(400)
                  self.send_header('Content-Type', 'application/json')
                  self.send_header('Content-Length', str(len(response)))
                  self.end_headers()
                  self.wfile.write(response)
              def do_GET(self):
                  response = json.dumps({'object': 'list', 'data': []}).encode()
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.send_header('Content-Length', str(len(response)))
                  self.end_headers()
                  self.wfile.write(response)
          server = ThreadingHTTPServer(('127.0.0.1', 0), Handler)
          threading.Thread(target=server.serve_forever, daemon=True).start()
          report = {'version': subprocess.check_output(['codex', '--version'], text=True).strip(), 'scope': 'CLI request construction only; no real model, account, or MTPLX inference', 'cases': []}
          cases = [
              ('default', []),
              ('web_disabled', ['-c', 'web_search="disabled"']),
              ('hosted_disabled', ['-c', 'web_search="disabled"', '--disable', 'image_generation']),
              ('local_minimal', ['-c', 'web_search="disabled"', '--disable', 'image_generation', '--disable', 'apps']),
          ]
          with tempfile.TemporaryDirectory() as tmp:
              for name, flags in cases:
                  home = pathlib.Path(tmp) / name
                  home.mkdir()
                  (home / 'config.toml').write_text('model = "mtplx-test"\nmodel_provider = "mtplx"\ncheck_for_update_on_startup = false\n[model_providers.mtplx]\nname = "Local capture only"\nbase_url = "http://127.0.0.1:%d/v1"\nwire_api = "responses"\nrequires_openai_auth = false\n' % server.server_port)
                  env = dict(os.environ, CODEX_HOME=str(home))
                  env.pop('OPENAI_API_KEY', None)
                  env.pop('CODEX_API_KEY', None)
                  feature_result = subprocess.run(['codex', *flags, 'features', 'list'], env=env, capture_output=True, text=True, timeout=30)
                  before = len(received)
                  result = subprocess.run(['codex', *flags, 'exec', '--skip-git-repo-check', 'Reply OK without using tools.'], env=env, cwd=tmp, capture_output=True, text=True, timeout=60)
                  captures = received[before:]
                  report['cases'].append({'name': name, 'flags': flags, 'feature_list_exit': feature_result.returncode, 'features': feature_result.stdout, 'client_exit': result.returncode, 'capture': captures, 'diagnostic_tail': result.stderr[-2000:]})
          server.shutdown()
          pathlib.Path('receipts/codex-contract.json').write_text(json.dumps(report, indent=2))
          print(json.dumps(report, indent=2))
          for case in report['cases'][2:]:
              assert case['feature_list_exit'] == 0, case['name']
              assert case['capture'], 'No first-request capture: ' + case['name']
              for capture in case['capture']:
                  assert not {'web_search', 'web_search_preview', 'image_generation'}.intersection(capture['tool_types']), case['name']
          PY
      - name: Archive exact anchor source for benchmark harness validation
        if: always()
        run: |
          git -C anchors archive --format=tar.gz c73af258def9abdef32765a89b502d9f41b662b6 -o "$GITHUB_WORKSPACE/receipts/mtplx-anchor-source.tar.gz"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mtplx-review-audit
          path: receipts/
          retention-days: 7
          if-no-files-found: error
