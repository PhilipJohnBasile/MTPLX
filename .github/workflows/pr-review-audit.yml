name: MTPLX readiness integration inspection
on:
  push:
    branches: [codex/pr-review-audit-20260906]
    paths: [.github/workflows/pr-review-audit.yml]
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == 'PhilipJohnBasile/MTPLX'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export exact integration candidates without publishing
        run: |
          mkdir -p /tmp/inspection
          git config user.name 'Source inspection'
          git config user.email 'inspection@example.invalid'
          git fetch --no-tags https://github.com/youssofal/MTPLX.git 21be78b3f51820eecef020e5e4855c0715eaf9a5
          git archive --format=tar.gz 21be78b3f51820eecef020e5e4855c0715eaf9a5 -o /tmp/inspection/upstream.tar.gz
          python - <<'PY'
          import json,pathlib,subprocess
          heads={219:'a47ea5eaf08f600b657ade1dfbe1baf51fce90aa',350:'bdb763e44c57dffbcb49a5d0af1e8a547be5d318',362:'11cfc4a6cfa098ec5f6f9ff71a30801577735d97',399:'48b18fc443688000f39406a47c8b634c5451b726',364:'baeae5ed5c19410ae81b75f5cac8b88504424b49',365:'b8d15162ba18c1f6a8388c367327c4727de64f76'}
          for number,head in heads.items():
              out=pathlib.Path('/tmp/inspection')/str(number);out.mkdir()
              work=pathlib.Path('/tmp')/f'mtplx-{number}'
              subprocess.run(['git','worktree','add','--detach',str(work),head],check=True)
              def git(*args,check=True):
                  return subprocess.run(['git','-C',str(work),*args],capture_output=True,check=check)
              base=git('merge-base',head,'21be78b3f51820eecef020e5e4855c0715eaf9a5').stdout.decode().strip()
              result=git('merge','--no-commit','--no-ff','21be78b3f51820eecef020e5e4855c0715eaf9a5',check=False)
              (out/'merge.log').write_bytes(result.stdout+result.stderr)
              if result.returncode not in (0,1): raise RuntimeError(f'Merge inspection failed: {number}')
              paths=git('diff','--name-only','--diff-filter=U').stdout.decode().splitlines()
              (out/'conflicts.diff').write_bytes(git('diff','--cc').stdout)
              for name in paths:
                  for stage,label in ((1,'base'),(2,'ours'),(3,'theirs')):
                      result=git('show',f':{stage}:{name}',check=False)
                      if result.returncode==0:
                          target=out/'stages'/label/name;target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(result.stdout)
              (out/'summary.json').write_text(json.dumps({'number':number,'head':head,'base':base,'upstream':'21be78b3f51820eecef020e5e4855c0715eaf9a5','conflicts':paths},indent=2))
              subprocess.run(['tar','--exclude=.git','-czf',str(out/'merged-worktree.tar.gz'),'-C',str(work),'.'],check=True)
              print(number,paths,flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mtplx-current-main-inspection
          path: /tmp/inspection/
          retention-days: 7
          if-no-files-found: error
