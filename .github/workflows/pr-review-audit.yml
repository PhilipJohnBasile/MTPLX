name: MTPLX current-main readiness validation
on:
  push:
    branches: [codex/pr-review-audit-20260906]
    paths: [.github/workflows/pr-review-audit.yml, .review/readiness_fixes.py, .review/finalize_readiness.py]
permissions:
  contents: read
jobs:
  validate:
    if: github.repository == 'PhilipJohnBasile/MTPLX'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {number: 219, head: a47ea5eaf08f600b657ade1dfbe1baf51fce90aa}
          - {number: 350, head: bdb763e44c57dffbcb49a5d0af1e8a547be5d318}
          - {number: 362, head: 11cfc4a6cfa098ec5f6f9ff71a30801577735d97}
          - {number: 399, head: 48b18fc443688000f39406a47c8b634c5451b726}
          - {number: 364, head: baeae5ed5c19410ae81b75f5cac8b88504424b49}
          - {number: 365, head: b8d15162ba18c1f6a8388c367327c4727de64f76}
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: audit
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.head }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        if: matrix.number == 364 || matrix.number == 365
        with:
          node-version: '22'
      - name: Integrate exact current main and scoped fixes
        working-directory: source
        run: |
          mkdir -p ../receipts
          git config user.name 'Philip John Basile'
          git config user.email 'PBasile@Basilecom.com'
          git fetch --no-tags https://github.com/youssofal/MTPLX.git 21be78b3f51820eecef020e5e4855c0715eaf9a5
          set +e
          git merge --no-commit --no-ff 21be78b3f51820eecef020e5e4855c0715eaf9a5 > ../receipts/merge.log 2>&1
          result=$?
          set -e
          if [ '${{ matrix.number }}' = 219 ]; then test "$result" -eq 1; else test "$result" -eq 0; fi
          python ../audit/.review/readiness_fixes.py . '${{ matrix.number }}'
          python ../audit/.review/finalize_readiness.py . '${{ matrix.number }}'
          if [ '${{ matrix.number }}' = 219 ]; then git add mtplx/server/openai.py tests/test_request_observability_golden.py; fi
          if [ '${{ matrix.number }}' = 362 ]; then git add mtplx/runtime_systems.py mtplx/server/openai.py mtplx/server/runtime_status.py tests/test_runtime_serving_status.py docs/runtime-systems.md; fi
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --cached --check
      - name: Install supported test toolchain
        working-directory: source
        run: |
          python -m pip install -q -e '.[dev,server]' openai==2.52.0 pytest-timeout
          python -c 'import mlx.core as mx; import platform; print(platform.platform(), platform.machine()); print(mx.metal.device_info())' > ../receipts/mlx-host.txt
      - name: Normalize new provider source before running tests
        if: matrix.number == 362
        working-directory: source
        run: |
          python -m ruff check --fix mtplx/runtime_systems.py mtplx/server/runtime_status.py tests/test_runtime_serving_status.py
          python -m ruff format mtplx/runtime_systems.py mtplx/server/runtime_status.py tests/test_runtime_serving_status.py
          git add mtplx/runtime_systems.py mtplx/server/runtime_status.py tests/test_runtime_serving_status.py
      - name: Validate scoped source, API and integration behavior
        working-directory: source
        env:
          PR_NUMBER: ${{ matrix.number }}
        run: |
          python - <<'PY'
          import os,pathlib,subprocess,sys
          number=int(os.environ['PR_NUMBER'])
          common=['tests/test_server_openai.py','tests/test_dashboard_endpoints.py','tests/test_no_mlx_imports.py']
          extra={219:['tests/test_server_responses.py','tests/test_request_observability_golden.py','tests/test_endpoint_probe_hygiene.py'],350:['tests/test_semantic_anchors.py','tests/test_semantic_anchor_replay.py']+[str(p) for p in pathlib.Path('tests').glob('test_session_bank*.py')],362:['tests/test_runtime_systems.py','tests/test_runtime_serving_status.py'],399:['tests/test_agent_profiles.py','tests/test_workspace_tools.py','tests/test_graphs.py','tests/test_memory.py','tests/test_memory_plan.py','tests/test_agent_orchestrator.py','tests/test_agent_cli.py','tests/test_graph_executor.py','tests/test_skills.py'],364:[],365:[]}
          paths=common+extra[number]
          assert all(pathlib.Path(p).is_file() for p in paths)
          with open('../receipts/tests.log','w') as log:
              result=subprocess.run([sys.executable,'-m','pytest','-q',*paths,'--timeout=60','--junitxml=../receipts/tests.xml'],stdout=log,stderr=subprocess.STDOUT)
          print(pathlib.Path('../receipts/tests.log').read_text()[-15000:])
          if result.returncode: raise SystemExit(result.returncode)
          touched={219:['mtplx/server/openai.py','tests/test_request_observability_golden.py'],362:['mtplx/runtime_systems.py','mtplx/server/runtime_status.py','tests/test_runtime_serving_status.py']}.get(number,[])
          if touched: subprocess.run([sys.executable,'-m','ruff','check',*touched],check=True)
          subprocess.run([sys.executable,'-m','compileall','-q','mtplx','tests'],check=True)
          PY
      - name: Build dashboard without committing regenerated assets
        if: matrix.number == 364 || matrix.number == 365
        working-directory: source/dashboard
        run: |
          set -o pipefail
          npx --yes bun@1.3.4 install --frozen-lockfile
          npm run build 2>&1 | tee ../../receipts/dashboard-build.log
          cd ..
          git restore --worktree mtplx/dashboard/_static
          git clean -f -- mtplx/dashboard/_static/assets
          test -z "$(git diff --name-only -- mtplx/dashboard/_static)"
          test -z "$(git diff --cached --name-only 21be78b3f51820eecef020e5e4855c0715eaf9a5 -- mtplx/dashboard/_static)"
      - name: Create tested merge candidate
        working-directory: source
        run: |
          git diff --check
          git diff --cached --check
          test -z "$(git diff --name-only)"
          test ! -e .github/workflows/pr-review-audit.yml
          test ! -e .review/readiness_fixes.py
          git commit -m 'Merge current upstream and complete PR ${{ matrix.number }} readiness integration'
          test "$(git rev-parse HEAD^)" = '${{ matrix.head }}'
          test "$(git rev-parse HEAD^2)" = 21be78b3f51820eecef020e5e4855c0715eaf9a5
          git branch validated-candidate HEAD
          git bundle create ../receipts/candidate.bundle validated-candidate ^'${{ matrix.head }}' ^21be78b3f51820eecef020e5e4855c0715eaf9a5
          git rev-parse HEAD > ../receipts/candidate-sha.txt
          git diff 21be78b3f51820eecef020e5e4855c0715eaf9a5...HEAD --stat > ../receipts/diff-stat.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mtplx-ready-${{ matrix.number }}
          path: receipts/
          retention-days: 7
          if-no-files-found: error
  candidates:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: mtplx-ready-*
          path: /tmp/receipts
      - name: Publish tested candidates only
        run: |
          git fetch --no-tags https://github.com/youssofal/MTPLX.git 21be78b3f51820eecef020e5e4855c0715eaf9a5
          for number in 219 350 362 399 364 365; do
            path=/tmp/receipts/mtplx-ready-$number
            git bundle verify "$path/candidate.bundle"
            git fetch "$path/candidate.bundle" validated-candidate:refs/heads/validated-$number
            test "$(git rev-parse validated-$number)" = "$(cat "$path/candidate-sha.txt")"
            test "$(git rev-parse validated-$number^2)" = 21be78b3f51820eecef020e5e4855c0715eaf9a5
            git push origin validated-$number:refs/heads/codex/pr$number-integrated-${{ github.run_id }}
          done
