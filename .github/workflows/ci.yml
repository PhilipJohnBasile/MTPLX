name: ci

on:
  pull_request:
  push:
    branches: [main, "codex/agent-workspace-*"]

permissions:
  contents: read

jobs:
  no-mlx-smoke:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
      - run: python -m pip install -U pip
      - run: python -m pip install -e ".[dev,server]"
      - run: python -m pytest tests/test_no_mlx_imports.py tests/test_public_cli.py tests/test_runtime_kpis.py tests/test_server_openai.py tests/test_openai_bridge.py tests/test_thermal.py tests/test_cache_state.py
      - run: python -m compileall -q mtplx tests

  agent-workspace:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev,server]"
      - name: Agent, memory, graph, and workspace regressions
        run: >-
          python -m pytest
          tests/test_agent_cli.py tests/test_agent_orchestrator.py
          tests/test_agent_profiles.py tests/test_graph_executor.py
          tests/test_graphs.py tests/test_memory.py tests/test_skills.py
          tests/test_workspace_tools.py

  swift-tests:
    # Swift 6.3.1+ fixes task-allocator crashes during async teardown.
    # Pin the stable toolchain instead of macos-15's Swift 6.1.2 default.
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
      - name: Toolchain versions
        run: |
          swift --version
          xcodebuild -version
          python3 --version
      - name: Startup and metrics regressions
        run: >-
          swift test --package-path apps/MTPLXApp
          --filter 'testBackendHeadlineDecode|testCancelDuringStartup'
      - run: swift test --package-path apps/MTPLXApp
