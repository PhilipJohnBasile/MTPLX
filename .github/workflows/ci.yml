name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  no-mlx-smoke:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
      - run: python -m pip install -U pip
      - run: python -m pip install -e ".[dev,server]"
      - run: python -m pytest tests/test_no_mlx_imports.py tests/test_public_cli.py tests/test_runtime_kpis.py tests/test_server_openai.py tests/test_openai_bridge.py tests/test_thermal.py tests/test_cache_state.py
      - run: python -m compileall -q mtplx tests

  native-systems:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
      - run: python -m pip install -U pip
      - run: python -m pip install -e ".[dev,server]"
      - name: Test semantic runtime and deterministic replay systems
        run: |
          python -m pytest -q \
            tests/test_semantic_anchors.py \
            tests/test_memory_governor.py \
            tests/test_expert_locality.py \
            tests/test_deterministic_replay.py \
            tests/test_trace_parity.py \
            tests/test_request_capture.py \
            tests/test_runtime_systems.py \
            tests/test_dashboard_endpoints.py
      - run: python -m compileall -q mtplx tests
