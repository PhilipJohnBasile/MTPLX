name: Temporary export upstream MTPLX source

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize exact upstream main
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/youssofal/MTPLX.git || true
          git fetch upstream main
          git checkout --detach upstream/main
          tar --exclude=.git -czf /tmp/mtplx-upstream-source.tar.gz .
          git rev-parse HEAD > /tmp/upstream-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: mtplx-upstream-source
          path: |
            /tmp/mtplx-upstream-source.tar.gz
            /tmp/upstream-sha.txt
          if-no-files-found: error
          retention-days: 1
      - name: Surface run ID for artifact retrieval
        shell: bash
        run: |
          echo "Artifact exported successfully; failing intentionally so the run ID is delivered in the notification."
          exit 1
