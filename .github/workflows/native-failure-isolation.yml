name: Native failure isolation
on:
  push:
    branches: [codex/pr-review-audit-20260906]
    paths: [.github/workflows/native-failure-isolation.yml]
permissions: {contents: read}
jobs:
  isolate:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {path: audit, persist-credentials: false}
      - uses: actions/checkout@v4
        with: {ref: 0dec47d37001efa614d622cc933a6bd633633321, path: source, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install runtime and apply scoped candidate
        working-directory: source
        run: |
          mkdir -p ../receipts
          python -m pip install -q -e '.[dev,server]'
          python3 ../audit/.review/native_fixes.py .
          python3 ../audit/.review/native_dispatch_fix.py .
          python3 ../audit/.review/native_concurrency_fix.py .
          git diff -- apps/MTPLXApp > ../receipts/native.patch
          python3 ../audit/.review/native_diagnostics.py .
          python3 ../audit/.review/native_transport_diagnostics.py .
          swift --version > ../receipts/swift-version.txt
          swift test --package-path apps/MTPLXApp list > ../receipts/test-list.log 2>&1
      - name: Run failures and static-state regressions independently
        working-directory: source
        run: |
          python3 - <<'PY'
          import pathlib,subprocess,os,json
          framework=next(pathlib.Path('apps/MTPLXApp/.build').rglob('Sparkle.framework'))
          env=dict(os.environ,DYLD_FRAMEWORK_PATH=str(framework.parent.resolve()),NSUnbufferedIO='YES',PYTHONUNBUFFERED='1')
          names=['testBackendHeadlineDecodeUsesRawCompletionTPSBeforeDisplayTPS','testBackendHeadlineDecodeIgnoresCumulativeAndStaleSnapshotMaxDuringLiveRequest','testCancelDuringStartupLeavesAppStoppedAndRestoresFans','testRefreshStaticState']
          results=[]
          for name in names:
              with open('../receipts/'+name+'.log','w') as log:
                  try:
                      result=subprocess.run(['swift','test','--skip-build','--package-path','apps/MTPLXApp','--filter',name],env=env,stdout=log,stderr=subprocess.STDOUT,timeout=90)
                      code=result.returncode
                  except subprocess.TimeoutExpired:code='timeout'
              results.append({'test':name,'exit':code})
          pathlib.Path('../receipts/results.json').write_text(json.dumps(results,indent=2))
          print(json.dumps(results,indent=2))
          PY
      - name: Preserve task crash diagnostics
        if: always()
        run: |
          mkdir -p receipts/crashes
          find "$HOME/Library/Logs/DiagnosticReports" -name '*MTPLX*' -type f -mmin -20 -exec cp {} receipts/crashes/ \; 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: native-isolation, path: 'receipts/', retention-days: 7, if-no-files-found: error}
