name: Native failure isolation
on:
  push:
    branches: [codex/pr-review-audit-20260906]
    paths: [.github/workflows/native-failure-isolation.yml]
permissions: {contents: read}
jobs:
  isolate:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {path: audit, persist-credentials: false}
      - uses: actions/checkout@v4
        with: {ref: 0dec47d37001efa614d622cc933a6bd633633321, path: source, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install runtime and compile exact candidate
        working-directory: source
        run: |
          mkdir -p ../receipts
          python -m pip install -q -e '.[dev,server]'
          python3 ../audit/.review/native_fixes.py .
          python3 ../audit/.review/native_dispatch_fix.py .
          python3 ../audit/.review/native_fixture_readiness.py .
          git diff --check
          git diff -- apps/MTPLXApp > ../receipts/native.patch
          swift --version > ../receipts/swift-version.txt
          swift test --package-path apps/MTPLXApp list > ../receipts/test-list.log 2>&1
      - name: Capture startup crash stack under LLDB
        working-directory: source
        run: |
          python3 - <<'PY'
          import pathlib,subprocess,os,json
          framework=next(pathlib.Path('apps/MTPLXApp/.build').rglob('Sparkle.framework'))
          env=dict(os.environ,DYLD_FRAMEWORK_PATH=str(framework.parent.resolve()),NSUnbufferedIO='YES')
          bundle=next(pathlib.Path('apps/MTPLXApp/.build').rglob('MTPLXAppPackageTests.xctest')).resolve()
          xctest=subprocess.check_output(['xcrun','--find','xctest'],text=True).strip()
          command=['lldb','--batch','-o','run','-k','thread backtrace all','-k','image list','--',xctest,'-XCTest','MTPLXAppCoreTests.MTPLXAppCoreTests/testCancelDuringStartupLeavesAppStoppedAndRestoresFans',str(bundle)]
          with open('../receipts/startup-lldb.log','w') as log:
              try:
                  result=subprocess.run(command,env=env,stdout=log,stderr=subprocess.STDOUT,timeout=90)
                  code=result.returncode
              except subprocess.TimeoutExpired:code='timeout'
          pathlib.Path('../receipts/results.json').write_text(json.dumps({'debugger_exit':code,'scope':'Diagnostic capture only. Debugger exit zero is not a passing test.'},indent=2))
          print(pathlib.Path('../receipts/startup-lldb.log').read_text()[-30000:])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: native-isolation, path: 'receipts/', retention-days: 7, if-no-files-found: error}
